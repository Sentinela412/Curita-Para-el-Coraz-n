<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Corazones y Estrella Central</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }

        #ui-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            padding: 25px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 30, 60, 0.6);
            border-radius: 20px;
            color: white;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 40px rgba(255, 30, 60, 0.3);
        }
        #ui-layer.active { transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        
        h2 { color: #ff2a55; margin: 0 0 10px 0; font-size: 1.3rem; }
        p { font-size: 1.1rem; line-height: 1.6; color: #fff; font-weight: 300; margin-bottom: 15px; }
        
        /* Estilo para la imagen dentro del modal */
        #m-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        button { 
            background: #ff2a55; border: none; padding: 12px 25px; 
            border-radius: 10px; cursor: pointer; font-weight: bold;
            color: #fff; transition: transform 0.2s; width: 100%;
        }
        button:hover { transform: scale(1.05); }

        #hint {
            position: fixed; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255, 100, 120, 0.85); pointer-events: none; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 2px; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="hint">Zhamira, toca la estrella central, un corazón o un lugar para interactuar</div>

    <div id="ui-layer">
        <h2 id="m-title">Curita Para El Corazón</h2>
        <p id="m-text"></p>
        <!-- Imagen justo debajo del texto -->
        <img id="m-img" src="" alt="Imagen del lugar">
        <button onclick="closeModal()">Cerrar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let galaxyObjects = [];
        let pointerStart = { x: 0, y: 0 };

        // 1 Mensaje para la Estrella Central + 15 Mensajes para los Corazones Rojos
        const messages = [
            "⭐ Estrellita es la luz más dulce de todo el universo, un regalo lleno de amor que ilumina el cielo para cuidar siempre los sueños de tu pequeña Aiunii", // Mensaje 0: Estrella Central
            "Con Dícelo le demostraste al mundo que la complicidad auténtica no se calla nada y se expresa siempre con la verdad del corazón",              // Mensaje 1: Corazón 1
            "Extrañándote es la prueba perfecta de cómo el dolor de una ausencia se puede transformar en ritmo, fuerza y pura vida",           // Corazón 2
            "En ¿Cómo se olvida? inmortalizas la verdad de que aquello que te marca el alma jamás se borra con el tiempo",                         // Corazón 3
            "Me hubiese gustado transmite con total transparencia la belleza melancólica de aceptar con madurez lo que no pudo ser",           // Corazón 4
            "A la mitad nos recuerda que el corazón solo se entrega entero, porque las historias verdaderas no entienden de medias tintas",                        // Corazón 5
            "En ¿Cómo fue? retratas con una ternura única ese suspiro con el que el corazón se pregunta en qué momento nació un sentimiento tan grande",                            // Corazón 6
            "No me quiero ir captura la belleza de esos instantes tan perfectos donde desearías que el tiempo se detuviera para siempre",                            // Corazón 7
            "Lista de espera demuestra que la paciencia es la mayor prueba de amor cuando sabes que la persona correcta vale cada segundo de aguardo",                               // Corazón 8
            "Desvelo transforma la nostalgia de las noches en blanco en la compañía más íntima y reconfortante del firmamento",                        // Corazón 9
            "Canela envuelve con una dulzura tan acogedora que se siente como la calidez de un hogar en medio del frío",                                  // Corazón 10
            "Con Quisiera le diste voz al anhelo más sincero de convertirse en el refugio y el lugar seguro de esa persona especial",                      // Corazón 11
            "Otra vez plasma esa magia inagotable de querer repetir los momentos más bonitos con quien amamos",                            // Corazón 12
            "Aunque la mente se llene de Mil preguntas, tu voz trae esa certeza inmediata que le devuelve la paz al alma",          // Corazón 13
            "En Salto de fe nos enseñaste que cuando el amor es auténtico, lanzarse al vacío deja de dar miedo para convertirse en bendición", // Corazón 14
            "Curita para el corazón es el abrazo hecho canción que demuestra que el amor verdadero siempre tiene la fuerza para sanar cualquier herida del pasado." // Corazón 15
        ];

        // Lista de lugares alrededor de la galaxia (con imágenes asignadas)
        const locations = [
            { 
                name: "San Juan, PR", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/306c6ba139ce766802a4648591bae077fb2c5213/Puerto%20Rico.png" 
            },
            { 
                name: "Miami, FL", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/85c50979da902e46731e78eaaf127989985a086f/Miami.png" 
            },
            { 
                name: "Orlando, FL", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/6fb8a3e2f730696f3422066cafb1fba6cf5dd2aa/Orlando.png" 
            },
            { 
                name: "New York, NY", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/5d468425801db1fcad21322791f6a44e4677b656/New%20York.png" 
            },
            { 
                name: "Santo Domingo, RD", 
                img: "https://github.com/Sentinela412/Curita-Para-el-Coraz-n/blob/main/Republica%20Dominicana.png?raw=true" 
            },
            { 
                name: "Buenos Aires, Argentina", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/50eb59b4e95b48283c4f56ca71f207aab798dbc4/Argentina.png" 
            },
            { 
                name: "Santiago, Chile", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/fae2b299ec144266a03400ea3f7cd14c2faa16d2/Chile.png" 
            },
            { 
                name: "Lima, Perú", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/51d4aef792f33d892dd63f101a7119a676a13e7c/Per%C3%BA.png" 
            },
            { 
                name: "Reading, PA", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/d6a4b11e5011ef78708aeb3a6c5ef1a470db4862/Pennsylvania.png" 
            },
            { 
                name: "Boston, MA", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/b9620e08066c973ad2e77328e79a4460917cfb94/Boston.png" 
            },
            { 
                name: "Chicago, IL", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/809e8772c564e7f56f5e4bcca4e26d7ab321ffd0/Chicago.png" 
            },
            { 
                name: "Atlanta, GA", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/41e51a4187aea8e957455aac3183bb6b6b448dbf/Atlanta.png" 
            },
            { 
                name: "San Jose, CR", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/8a3b0654d5f4aeb5859494e5e912a094c810c55b/Costa%20Rica.png" 
            },
            { 
                name: "Quito, Ecuador", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/e0ee9c59a8ecb3ae86c47064b4eae38e6e424575/quito.png" 
            },
            { 
                name: "Tenerife, Spain", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/8446b494b1ca44c3bb8680ba6381c53532a936d4/Tenerife.png" 
            },
            { 
                name: "Gran Canarias, Spain", 
                img: "https://raw.githubusercontent.com/Sentinela412/Curita-Para-el-Coraz-n/46ba326d4b4426dba1c72f05b7ff50f500ee6a22/Gran%20Canaria.png" 
            },
            "Barcelona, Spain",
            "Madrid, Spain",
            "Bogota, CO"
        ];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 60, 180);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enableDamping = true;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Fondo de estrellas
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<8000; i++) {
                starPos.push((Math.random()-0.5)*1500, (Math.random()-0.5)*1500, (Math.random()-0.5)*1500);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(starGeo, starMat));

            // 1. Crear la Única Estrella en el Centro (0, 0, 0)
            createCentralStar();

            // 2. Crear los 15 Corazones Rojos distribuidos alrededor
            for(let i = 1; i <= 15; i++) {
                createRedHeart(i);
            }

            // 3. Crear las etiquetas con los nombres de los lugares alrededor de la galaxia
            createLocationLabels();

            // Eventos unificados (clic y toque)
            window.addEventListener('pointerdown', (e) => {
                pointerStart.x = e.clientX;
                pointerStart.y = e.clientY;
            });

            window.addEventListener('pointerup', (e) => {
                const moveDist = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
                if (moveDist < 10) onSelect(e);
            });

            window.addEventListener('resize', onResize);
            animate();
        }

        function createHeartShape() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 2);
            shape.bezierCurveTo(0, 3, -1.5, 4.5, -3, 4.5);
            shape.bezierCurveTo(-5, 4.5, -5, 2, -5, 2);
            shape.bezierCurveTo(-5, 0, -3, -2, 0, -4);
            shape.bezierCurveTo(3, -2, 5, 0, 5, 2);
            shape.bezierCurveTo(5, 2, 5, 4.5, 3, 4.5);
            shape.bezierCurveTo(1.5, 4.5, 0, 3, 0, 2);
            return shape;
        }

        function createStarShape() {
            const shape = new THREE.Shape();
            const points = 5;
            const outerRadius = 4.5;
            const innerRadius = 2.0;
            for (let i = 0; i < points * 2; i++) {
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            return shape;
        }

        function createCentralStar() {
            const group = new THREE.Group();
            const shape = createStarShape();
            const geometry = new THREE.ShapeGeometry(shape);

            const material = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.scale.set(1.4, 1.4, 1);
            group.add(mesh);

            group.position.set(0, 0, 0);
            group.userData = { msg: messages[0] };
            galaxyObjects.push(group);
            scene.add(group);
        }

        function createRedHeart(index) {
            const group = new THREE.Group();
            const shape = createHeartShape();
            const geometry = new THREE.ShapeGeometry(shape);

            const redColors = [0xff0033, 0xe60000, 0xff1a40, 0xcc0029, 0xff2e55, 0xd60036];
            const chosenColor = redColors[index % redColors.length];

            const material = new THREE.MeshBasicMaterial({ color: chosenColor, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);

            const angle = (index - 1) * ((Math.PI * 2) / 15);
            const radius = 30 + (index * 3.5);
            
            group.position.set(
                Math.cos(angle) * radius,
                (Math.random() - 0.5) * 15,
                Math.sin(angle) * radius
            );

            group.userData = { msg: messages[index] };
            galaxyObjects.push(group);
            scene.add(group);
        }

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 32px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = '#ff2a55';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }

        function createLocationLabels() {
            const total = locations.length;
            for (let i = 0; i < total; i++) {
                const item = locations[i];
                const name = typeof item === 'object' ? item.name : item;
                const img = typeof item === 'object' ? item.img : null;

                const texture = createTextTexture(name);
                const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(material);
                
                sprite.scale.set(32, 8, 1);
                
                const angle = (i / total) * Math.PI * 2;
                const radius = 95 + (i % 3) * 12; 
                const yOffset = (Math.sin(i * 1.5) * 20);
                
                sprite.position.set(
                    Math.cos(angle) * radius,
                    yOffset,
                    Math.sin(angle) * radius
                );

                sprite.userData = { msg: `📍 ${name}`, img: img };
                galaxyObjects.push(sprite);
                scene.add(sprite);
            }
        }

        function onSelect(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(galaxyObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj.parent && !obj.userData.msg) obj = obj.parent;
                
                if(obj.userData.msg) {
                    document.getElementById('m-text').innerText = obj.userData.msg;
                    
                    const imgEl = document.getElementById('m-img');
                    if (obj.userData.img) {
                        imgEl.src = obj.userData.img;
                        imgEl.style.display = 'block';
                    } else {
                        imgEl.src = '';
                        imgEl.style.display = 'none';
                    }

                    document.getElementById('ui-layer').classList.add('active');
                    controls.autoRotate = false;
                }
            }
        }

        function closeModal() {
            document.getElementById('ui-layer').classList.remove('active');
            const imgEl = document.getElementById('m-img');
            imgEl.src = '';
            imgEl.style.display = 'none';
            controls.autoRotate = true;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            galaxyObjects.forEach(s => {
                if (!s.isSprite) s.lookAt(camera.position);
            });
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
